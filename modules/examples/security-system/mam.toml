# MAM Project Manifest
# A multi-file MAM system composed from modules/ (see plan-doc/full-mam.md §19).

[project]
name = "security-system"
version = "1.0.0"
description = "Authorized security reconnaissance system composed from modules"
license = "MIT"
authors = ["TCP Ecosystems"]

[build]
entry = "system.mam"
modules = [
  "modules/**/*.mam",
  "modules/**/*.mam.md",
]
outDir = "dist"
targets = ["python"]

[dependencies]
