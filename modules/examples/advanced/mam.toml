# MAM Project Manifest
# A multi-file MAM system composed from modules/ (see plan-doc/full-mam.md §19).

[project]
name = "advanced"
version = "1.0.0"
description = "Advanced MAM system composed from multi agent and workflow modules"
license = "MIT"
authors = ["TCP Ecosystems"]

[build]
entry = "system.mam"
modules = [
  "modules/**/*.mam",
  "modules/**/*.mam.md",
]
outDir = "dist"
targets = ["python"]

[dependencies]