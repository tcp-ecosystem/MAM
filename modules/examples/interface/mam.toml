# MAM Project Manifest
# Example folder: system.mam composes the modules in modules/ (see plan-doc/full-mam.md, section 19).

[project]
name = "interface"
version = "2.0.0"
description = "Interface example folder: a composition root plus canonical .mam/.mam.md modules"
license = "MIT"
authors = ["TCP Ecosystems"]

[build]
entry = "system.mam"
modules = [
  "modules/**/*.mam",
  "modules/**/*.mam.md",
]
outDir = "dist"
targets = ["python"]

[dependencies]
