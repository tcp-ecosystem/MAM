[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "mam-sdk"
version = "0.1.0"
description = "MAM Python SDK"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"

[project.scripts]
mam = "mam.cli:main"
