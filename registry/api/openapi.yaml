openapi: 3.0.3
info:
  title: MAM Registry API
  description: >
    Public contract for the MAM module registry. The GraphQL schema in
    `graphql/schema.graphql` and the resolvers in `src/resolvers.ts` describe
    the same surface; this document is the equivalent for REST clients and for
    code generators.
  version: 0.1.0
  license:
    name: MIT
  contact:
    name: MAM Team

servers:
  - url: http://localhost:3000
    description: Local development
  - url: https://registry.mam.dev
    description: Production

tags:
  - name: modules
    description: Publishing and retrieving modules
  - name: versions
    description: Module version history
  - name: search
    description: Discovery
  - name: admin
    description: Registry administration

security:
  - bearerAuth: []

paths:
  /modules:
    get:
      tags: [modules]
      summary: List modules
      description: >
        Lists modules with optional filtering and pagination. Archived modules
        are hidden unless `includeArchived` is true.
      operationId: listModules
      parameters:
        - name: query
          in: query
          summary: Free-text match against name, description and tags
          schema: { type: string }
        - name: tag
          in: query
          summary: Exact tag match, case-insensitive
          schema: { type: string }
        - name: author
          in: query
          summary: Exact author match, case-insensitive
          schema: { type: string }
        - name: limit
          in: query
          summary: Page size
          description: Clamped to 1..100. Defaults to 20.
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: offset
          in: query
          summary: Number of modules to skip
          schema: { type: integer, minimum: 0, default: 0 }
        - name: includeArchived
          in: query
          summary: Include archived modules
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: Matching modules
          content:
            application/json:
              schema:
                type: object
                required: [modules, total, limit, offset]
                properties:
                  modules:
                    type: array
                    items: { $ref: '#/components/schemas/Module' }
                  total: { type: integer, description: Modules matching the filters before pagination }
                  limit: { type: integer }
                  offset: { type: integer }
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

    post:
      tags: [modules]
      summary: Publish a module
      description: Publishes a new version, creating the module when absent.
      operationId: publishModule
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PublishRequest' }
      responses:
        '201':
          description: Module published
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Module' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: A version with this integrity hash already exists
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500':
          $ref: '#/components/responses/InternalError'

  /modules/search:
    get:
      tags: [search]
      summary: Search modules
      description: Free-text search. Excludes archived modules.
      operationId: searchModules
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 1 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: Matching modules
          content:
            application/json:
              schema:
                type: object
                required: [modules, total]
                properties:
                  modules:
                    type: array
                    items: { $ref: '#/components/schemas/Module' }
                  total: { type: integer }
        '400':
          $ref: '#/components/responses/BadRequest'

  /modules/{name}:
    get:
      tags: [modules]
      summary: Get module details
      operationId: getModule
      parameters:
        - $ref: '#/components/parameters/ModuleName'
      responses:
        '200':
          description: Module details
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Module' }
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [admin]
      summary: Delete a module
      description: Removes the module and all of its versions. Irreversible.
      operationId: deleteModule
      parameters:
        - $ref: '#/components/parameters/ModuleName'
      responses:
        '204':
          description: Module deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /modules/{name}/archive:
    put:
      tags: [admin]
      summary: Archive or unarchive a module
      description: >
        Archived modules stay resolvable by name and version; they are hidden
        from listings and search.
      operationId: archiveModule
      parameters:
        - $ref: '#/components/parameters/ModuleName'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                archived:
                  type: boolean
                  default: true
      responses:
        '200':
          description: Updated module
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Module' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /modules/{name}/versions:
    get:
      tags: [versions]
      summary: List module versions
      description: Newest first by semver.
      operationId: listModuleVersions
      parameters:
        - $ref: '#/components/parameters/ModuleName'
      responses:
        '200':
          description: Versions
          content:
            application/json:
              schema:
                type: object
                required: [versions, total]
                properties:
                  versions:
                    type: array
                    items: { $ref: '#/components/schemas/Version' }
                  total: { type: integer }
        '404':
          $ref: '#/components/responses/NotFound'

  /modules/{name}/versions/{version}:
    get:
      tags: [versions]
      summary: Get a specific version
      operationId: getModuleVersion
      parameters:
        - $ref: '#/components/parameters/ModuleName'
        - name: version
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Version record
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Version' }
        '404':
          $ref: '#/components/responses/NotFound'

  /stats:
    get:
      tags: [admin]
      summary: Registry statistics
      operationId: getRegistryStats
      responses:
        '200':
          description: Aggregate counts
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RegistryStats' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Required for publish, delete and archive operations.

  parameters:
    ModuleName:
      name: name
      in: path
      required: true
      description: Module name
      schema: { type: string, minLength: 1 }

  responses:
    BadRequest:
      description: The request was malformed
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Missing or invalid credentials
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: No such module or version
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    InternalError:
      description: Unexpected server error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Module:
      type: object
      required: [name, version, author, tags, downloads, publishedAt, archived, versionCount]
      properties:
        name: { type: string }
        version:
          type: string
          description: Latest published version
        description: { type: string, nullable: true }
        author: { type: string }
        tags:
          type: array
          items: { type: string }
        downloads:
          type: integer
          description: Always 0 until the store tracks downloads
        publishedAt:
          type: string
          format: date-time
          description: Last publish or metadata change
        archived:
          type: boolean
          description: Archived modules stay resolvable but are hidden from listings
        versionCount: { type: integer }

    Version:
      type: object
      required: [version, tarball, integrity, publishedAt, publishedBy, fileCount]
      properties:
        version: { type: string }
        manifest:
          type: object
          additionalProperties: true
          description: The manifest exactly as published
        tarball: { type: string }
        integrity:
          type: string
          description: Integrity hash of the published files
        publishedAt: { type: string, format: date-time }
        publishedBy: { type: string }
        fileCount: { type: integer }

    PublishRequest:
      type: object
      required: [name, version]
      properties:
        name: { type: string, minLength: 1 }
        version: { type: string, minLength: 1 }
        description: { type: string }
        author: { type: string, default: anonymous }
        tags:
          type: array
          items: { type: string }
        files:
          type: object
          description: Path to file contents, as text
          additionalProperties: { type: string }

    RegistryStats:
      type: object
      required: [modules, totalVersions, archived]
      properties:
        modules: { type: integer }
        totalVersions: { type: integer }
        archived: { type: integer }

    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
        field:
          type: string
          description: The offending field, when the error is a validation failure
