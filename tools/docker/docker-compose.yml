services:
  cli:
    build:
      context: ../../
      dockerfile: tools/docker/Dockerfile.dev
    ports:
      - "3000:3000"
    volumes:
      - ../../:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
    working_dir: /app/cli
    command: ["pnpm", "run", "dev"]

  mcp:
    build:
      context: ../../
      dockerfile: tools/docker/Dockerfile.dev
    ports:
      - "3001:3000"
    volumes:
      - ../../:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
    working_dir: /app/mcp
    command: ["pnpm", "run", "dev"]

  runtime:
    build:
      context: ../../
      dockerfile: tools/docker/Dockerfile.dev
    ports:
      - "3002:3000"
    volumes:
      - ../../:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
    working_dir: /app/runtime
    command: ["pnpm", "run", "dev"]